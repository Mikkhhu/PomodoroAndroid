name: Build Pomodoro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -o PomodoroAndroid.zip -d extracted
          find extracted -type f \( -name build.gradle -o -name build.gradle.kts \)

      - name: Build APK
        run: |
          cd extracted/PomodoroAndroid
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Pomodoro-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
